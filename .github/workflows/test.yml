name: Test

on:
  push:
    branches: [main]
    # Changes only to prose, images or repository metadata skip the tests.
    # docs/ still counts: tests check docs/diagnostics.md against the rules.
    paths:
      - '**'
      - '!**.md'
      - 'docs/**'
      - '!art/**'
      - '!LICENSE'
      - '!.github/CODEOWNERS'
  pull_request:
    branches: [main]
    # Changes only to prose, images or repository metadata skip the tests.
    # docs/ still counts: tests check docs/diagnostics.md against the rules.
    paths:
      - '**'
      - '!**.md'
      - 'docs/**'
      - '!art/**'
      - '!LICENSE'
      - '!.github/CODEOWNERS'
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  wasm:
    # Compile only: the web build is never run in CI, since running it has
    # exhausted a machine's memory before.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build every package for wasip1
        env:
          GOOS: wasip1
          GOARCH: wasm
          CGO_ENABLED: '0'
        run: go build ./...

      - name: Build the WASM binary
        run: make wasm

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install fixture dependencies
        run: |
          composer install --working-dir testdata/laravel --no-interaction --no-progress --prefer-dist --no-scripts
          composer install --working-dir testdata/symfony --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Cache Composer downloads for the Filament workspace
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-filament-${{ hashFiles('scripts/fetch-filament.sh') }}

      - name: Fetch the Filament workspace
        run: bash scripts/fetch-filament.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test
        env:
          TUSK_PHP_TOKENIZERS: php;docker run --rm -i -v /tmp:/tmp:ro php:7.4-cli php
        run: go test -v -race -timeout 600s -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
