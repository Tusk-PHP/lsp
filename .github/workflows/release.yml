name: Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Derive release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' does not contain a valid semantic version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Get release info
        id: query-release-info
        uses: release-flow/keep-a-changelog-action@74931dec7ecdbfc8e38ac9ae7e8dd84c08db2f32 # v3
        with:
          command: query
          changelog: CHANGELOG.md
          version: ${{ steps.version.outputs.value }}

      - name: Build release binaries
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            IFS='/' read -r goos goarch <<< "$target"
            output="dist/tusk-php-${goos}-${goarch}"
            if [[ "$goos" == "windows" ]]; then
              output+=".exe"
            fi
            echo "Building ${goos}/${goarch}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -ldflags="-s -w -X main.version=${VERSION}" -trimpath -o "$output" ./cmd/tusk-php/
          done
          # SHA-256 sums the editor extensions (Tusk-PHP/vscode, Tusk-PHP/zed) pin against.
          ( cd dist && sha256sum tusk-php-* > checksums.txt )
          echo "Checksums:"; cat dist/checksums.txt

      - name: Publish to GitHub releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.query-release-info.outputs.release-notes }}
          files: |
            dist/tusk-php-linux-amd64
            dist/tusk-php-linux-arm64
            dist/tusk-php-darwin-amd64
            dist/tusk-php-darwin-arm64
            dist/tusk-php-windows-amd64.exe
            dist/checksums.txt
