# Coverage covers the language server itself. Left out:
# - bench/: the benchmark harness that compares Tusk PHP with other servers.
# - *_generated.go: generated code (builtin symbol tables, the PHP AST walker).
# - internal/php/ast/gen: the generator of that walker, checked by its own test.
# - internal/php/phpref: test helpers that run PHP's tokenizer and parser as a reference.
# internal/conformance builds only with the `conformance` tag, so it's never measured.
ignore:
  - "bench/**"
  - "**/*_generated.go"
  - "internal/php/ast/gen/**"
  - "internal/php/phpref/**"
